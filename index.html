<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#234b3d" />
    <script>
      (() => {
        let preference = 'system';
        try {
          preference = localStorage.getItem('first-move.theme.v1') || 'system';
        } catch {}
        const dark =
          preference === 'dark' ||
          (preference !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = dark ? '#14221d' : '#f7f8f3';
      })();
    </script>
    <meta
      name="description"
      content="Understand the idea. Remember the move. A thoughtful, interactive chess opening trainer."
    />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>First Move — A stronger game starts here</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
